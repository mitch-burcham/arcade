# Railway service config for arcade. Builds from source via Dockerfile.railway
# (the repo's root Dockerfile is runtime-only and won't build on Railway).
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.railway"

[deploy]
# api-server serves /health on the api port ($PORT) in mode=all. Verified 200.
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
